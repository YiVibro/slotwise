
services:
  postgres:
    image: postgres:16-alpine
    container_name: slotwise-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise_local_password
      POSTGRES_DB: slotwise
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise -d slotwise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
